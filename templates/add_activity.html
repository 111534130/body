<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新增活動</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8f9fa; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        input:focus { border-color: #4CAF50; outline: none; }
        .btn { width: 100%; padding: 15px; background-color: #4CAF50; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #45a049; }
        .btn-back { background-color: #607d8b; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>新增活動</h1>
        <form action="{{ url_for('add_activity') }}" method="POST" onsubmit="return validateForm()">
            <div class="form-group">
                <label>活動名稱</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>日期</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>地點</label>
                <input type="text" name="location" required>
            </div>
            <div class="form-group">
                <label>名額數量 (至少為 1)</label>
                <input type="number" id="capacity" name="capacity" min="1" required>
            </div>
            <div class="form-group">
                <label>場次 (請用逗號隔開，如：上午場,下午場)</label>
                <input type="text" name="session" required>
            </div>
            <button type="submit" class="btn">確定新增</button>
            <a href="{{ url_for('admin_dashboard') }}" style="text-decoration: none;"><button type="button" class="btn btn-back">返回儀表板</button></a>
        </form>
    </div>

    <script>
        function validateForm() {
            var capacity = document.getElementById("capacity").value;
            if (capacity < 1) {
                alert("活動名額不能為負數或零，請輸入至少 1 個名額。");
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
